services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-employee_management_db}
      MYSQL_USER: ${DB_USER:-employee_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.production}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      CREATE_DEMO_DATA: "false"
      AUTO_INITIALIZE_DATABASE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3

  migrate:
    build: ./backend
    restart: "no"
    command: ["python", "migrate.py"]
    env_file: .env.production
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      APP_ENV: production
      SESSION_COOKIE_SECURE: "true"
      TRUST_PROXY_HEADERS: "true"
      CREATE_DEMO_DATA: "false"
      AUTO_INITIALIZE_DATABASE: "false"
    depends_on:
      mysql:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
